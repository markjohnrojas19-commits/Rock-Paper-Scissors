<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="javascript2.js" defer></script>
  </head>
  <body>
    <h3 id="title">Rock Paper Scissor</h3>
    <div id="contentContainer">
      <div id="scoresShower">
        <h4>Computer: <span id="computerScores">0</span></h4>
        <h4>Player: <span id="humanScores">0</span></h4>
      </div>

      <div class="containerOfImages">
        <div class="border">
          <img
            class="player1ChooseShower"
            src="./images/rock.png"
            alt="playerChoose"
          />
        </div>

        <div class="border">
          <img
            class="computerChooseShower"
            src="./images/rock.png"
            alt="computerChoose"
          />
        </div>
      </div>

      <div id="operationContainer">
        <div class="announcer-Container">
          <h4 id="announcer">Choose Your Destiny</h4>
        </div>

        <div id="pickingSection">
          <button id="rock">rock</button>
          <button id="paper">paper</button>
          <button id="scissor">scissor</button>
        </div>
      </div>

      <h5 class="footer">Copyright © Mark John Rojas 2026</h5>
    </div>
  </body>
</html>
