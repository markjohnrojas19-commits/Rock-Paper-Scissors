<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript2.js" defer></script>
  </head>
  <body>
    <div id="scoresShower">
      <h4>Computer: <span id="computerScores">0</span></h4>
      <h4>Player 1: <span id="humanScores">0</span></h4>
    </div>

    <div class="containerOfImages">
      <img
        class="player1ChooseShower"
        src="/images/rock.png"
        alt="playerChoose"
      />

      <img
        class="computerChooseShower"
        src="/images/rock.png"
        alt="computerChoose"
      />
    </div>

    <h4 id="announcer">Choose Your Destiny</h4>

    <div id="pickingSection">
      <button id="rock">rock</button>
      <button id="paper">paper</button>
      <button id="scissor">scissor</button>
    </div>
  </body>
</html>
